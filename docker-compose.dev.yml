# Local dependency services ONLY (Postgres, Redis). RabbitMQ is intentionally
# NOT here - KubeForge uses a managed cloud broker (Amazon MQ / CloudAMQP)
# for RabbitMQ in every environment, including local dev. Export RABBITMQ_URL
# yourself (or put it in services/api/.env and services/worker/.env) before
# running `npm run dev` in each service.
version: '4.86'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kubeforge
      POSTGRES_PASSWORD: kubeforge
      POSTGRES_DB: kubeforge
    ports:
      - '5432:5432'
    volumes:
      - kubeforge_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  kubeforge_pgdata:
