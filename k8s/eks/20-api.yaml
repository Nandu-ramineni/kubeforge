# __API_IMAGE__ is substituted by scripts/deploy-to-eks.sh with the real ECR
# repository URL + tag (e.g. 381492249826.dkr.ecr.us-east-1.amazonaws.com/
# kubeforge-api:v0.1.0) - never applied with the placeholder still in place.
#
# No imagePullPolicy override here (unlike k8s/local's :local images) - the
# default (IfNotPresent) is correct now that images are pulled from a real
# registry the node group's IAM role (modules/iam's AmazonEC2ContainerRegistry
# ReadOnly attachment from Phase 5) already has permission to read from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kubeforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: kubeforge-config
            - secretRef:
                name: kubeforge-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kubeforge
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
