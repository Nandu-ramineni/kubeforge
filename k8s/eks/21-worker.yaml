apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kubeforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: __WORKER_IMAGE__
          ports:
            - containerPort: 3001
          env:
            - name: HEALTH_PORT
              value: "3001"
          envFrom:
            - configMapRef:
                name: kubeforge-config
            - secretRef:
                name: kubeforge-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
