apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeforge-config
  namespace: {{ .Values.namespace }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TASK_QUEUE_NAME: {{ .Values.config.taskQueueName | quote }}
  TASK_CACHE_TTL_SECONDS: {{ .Values.config.taskCacheTtlSeconds | quote }}
  QUEUE_PREFETCH: {{ .Values.config.queuePrefetch | quote }}
  DB_SSL: {{ .Values.config.dbSsl | quote }}
