# One ServiceAccount per service, none of them granted any RBAC permissions
# at all. This might look like it does nothing, but it's the correct
# least-privilege move here: none of api/worker/frontend ever call the
# Kubernetes API from inside the app (no in-cluster client usage anywhere in
# services/*/src), so there is no permission that would ever be
# legitimately needed. Using the `default` ServiceAccount for everything
# would work identically today but silently invites scope creep later - the
# next person who needs the app to read a ConfigMap via the K8s API, say,
# would be tempted to grant that to `default`, which every other pod in the
# namespace also uses. A dedicated identity per service means any future
# permission is scoped to exactly the one workload that needs it.
# automountServiceAccountToken: false on the pod spec itself (see
# templates/_helpers.tpl) means these tokens are never even mounted into the
# containers - there's nothing to steal if a container is ever compromised.
{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
---
{{- end }}
