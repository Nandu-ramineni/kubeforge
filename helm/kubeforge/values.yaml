# Defaults. gitops/environments/<env>/values.yaml overrides only what's
# actually different per environment (mainly image.registry and image.tag -
# see that file's own comments for why those two specifically live outside
# this chart).

namespace: kubeforge

image:
  registry: "" # set per environment - the ECR registry host
  tag: "manual" # overwritten by CI's GitOps commit (see .github/workflows/ci.yml's update-gitops job)
  pullPolicy: IfNotPresent

config:
  logLevel: info
  taskQueueName: tasks.process
  taskCacheTtlSeconds: "30"
  queuePrefetch: "5"
  # true for real EKS + RDS (RDS enforces SSL). Local kind dev still uses the
  # raw k8s/local manifests directly, not this chart, so this default only
  # ever needs to be true here - see services/api/src/config.js and
  # services/api/src/db.js for what actually consumes this.
  dbSsl: "true"

redis:
  enabled: true # in-cluster stand-in for ElastiCache - no ElastiCache module exists yet (Phase 5)
  image: redis:7-alpine
  port: 6379

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health/live

# NetworkPolicy egress to RDS is scoped to the VPC CIDR (RDS has no stable
# pod identity to select on - it isn't a pod at all). This has to match
# whatever environment this is actually deployed to - dev's is 10.0.0.0/16
# per infrastructure/terraform/environments/dev/terraform.tfvars. staging/
# production override this in their own gitops values (10.1.0.0/16,
# 10.2.0.0/16) once those environments are actually applied.
networkPolicy:
  enabled: true
  vpcCidr: "10.0.0.0/16"

# One entry per service. templates/deployment.yaml and templates/rollout.yaml
# both range over this map (Deployment for useRollout:false, Rollout for
# useRollout:true) via a shared pod-spec named template
# (templates/_helpers.tpl), so there's exactly one place each service's
# container spec is actually defined regardless of which K8s resource kind
# ends up wrapping it.
services:
  api:
    port: 3000
    replicas: 2
    createService: true
    needsConfig: true
    needsSecret: true
    useRollout: true # canary deployments - api is the traffic-serving component where gradual rollout matters most
    publicIngress: true # reachable from the ALB - see networkpolicy.yaml
    needsRedisEgress: true
    needsRdsEgress: true
    needsRabbitmqEgress: true
    extraEnv:
      PORT: "3000"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  worker:
    port: 3001
    replicas: 2
    createService: false # queue consumer only, nothing routes to it via a Service
    needsConfig: true
    needsSecret: true
    useRollout: false
    publicIngress: false # nothing calls worker directly - it only ever initiates outbound connections
    needsRedisEgress: true
    needsRdsEgress: true
    needsRabbitmqEgress: true
    extraEnv:
      HEALTH_PORT: "3001"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  frontend:
    port: 3002
    replicas: 2
    createService: true
    needsConfig: false # no dependency env vars needed at all
    needsSecret: false
    useRollout: false # static file serving only - the actual API traffic (where canary matters) goes to `api`, not through frontend
    publicIngress: true
    needsRedisEgress: false
    needsRdsEgress: false
    needsRabbitmqEgress: false
    extraEnv:
      PORT: "3002"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }

# api's canary strategy - time-based auto-promotion for now. Phase 11 (once
# Prometheus/Grafana exist) is the natural place to replace the fixed pauses
# below with AnalysisTemplate-driven promotion that checks real error-rate/
# latency metrics before continuing each step, and rolls back automatically
# if they regress - noted here rather than built now, since there's no
# metrics source to analyze against yet.
canary:
  steps:
    - setWeight: 5
    - pauseSeconds: 60
    - setWeight: 25
    - pauseSeconds: 60
    - setWeight: 50
    - pauseSeconds: 60
    - setWeight: 100
